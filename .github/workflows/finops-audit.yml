name: "FinOps AI Auditor"

on:
  workflow_dispatch: # Allows you to trigger it manually via the UI

permissions:
  id-token: write # MANDATORY for the OIDC handshake
  contents: write  # Allows the runner to read your code

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Debug - Where am I and what is here?
        run: |
          pwd
          ls -R  # This will show the whole tree. Find where main.tf is!
          
      - name: Terraform Init
        # This MUST be where your state is. If it's modular, go there.
        run: terraform init --reconfigure
        working-directory: terraform/modules # or terraform/modules if that's your root module

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Direct ARN usage to avoid 403 Secret-masking issues
          role-to-assume: arn:aws:iam::319310747432:role/GitHubActionsServiceRole
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AI Remediation
        run: |
          pip install boto3
          # Using the script we refined earlier
          python python/scripts/collect_evidence.py
      - name: Verify Handover
        run: |
          echo "Current Directory: $(pwd)"
          echo "Searching for ai_decision.json..."
          ls -l ai_decision.json || echo "❌ FILE NOT FOUND IN ROOT"

      - name: Apply Remediation to HCL
        run: |
          # This calls the "sed-like" function inside your script
          python python/scripts/apply_fix.py

      - name: Check for Changes
        id: git-check
        run: |
          git status --porcelain
          echo "changes=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

      - name: Commit and Push (The Actuator)
        if: steps.git-check.outputs.changes != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Extract the recommendation for a better commit message
          RECOMMENDATION=$(python3 -c "import json; print(json.load(open('ai_decision.json'))['recommendation'])")
          
          # 2. Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Create branch and push
          BRANCH_NAME="finops/optimize-to-${RECOMMENDATION}-${{ github.run_number }}"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "FinOps: AI recommended resize to ${RECOMMENDATION}"
          git push origin $BRANCH_NAME